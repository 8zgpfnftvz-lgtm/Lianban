name: Update Dabanke review data

on:
  schedule:
    - cron: "20 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest public review data
        run: python3 tools/fetch_dabanke.py --latest --limit 1
      - name: Commit data
        run: |
          if git diff --quiet -- dabanke_data.json; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "tiantianban-bot"
          git config user.email "tiantianban-bot@users.noreply.github.com"
          git add dabanke_data.json
          git commit -m "chore: update dabanke review data"
          git push
